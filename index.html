<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#edf3f8" />
  <title>今天怎麼穿？</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section id="screen-home" class="screen active home-screen" aria-labelledby="home-title">
      <div class="sky-orb sky-orb-a" aria-hidden="true"></div>
      <div class="sky-orb sky-orb-b" aria-hidden="true"></div>

      <header class="home-topbar">
        <div id="homeWeather" class="weather-badge" aria-live="polite">
          <span id="homeWeatherIcon">☁️</span>
          <strong id="homeTemp">--°</strong>
          <small id="homePlace">尚未定位</small>
        </div>
        <button id="personSwitchBtn" class="round-btn" aria-label="切換人物">◎</button>
      </header>

      <div class="home-copy">
        <p class="eyebrow">WEATHER × OUTFIT</p>
        <h1 id="home-title">今天<br>怎麼穿？</h1>
        <p>出門前 3 秒，搞定穿搭。</p>
      </div>

      <div id="homeCharacter" class="home-character" aria-hidden="true"></div>

      <div class="home-controls">
        <div class="search-card">
          <div class="search-label"><span>⌖</span><span>搜尋目的地</span></div>
          <div id="googlePlaceHost" class="google-place-host" aria-label="Google 地點搜尋"></div>
          <p id="destinationStatus" class="micro-text destination-status" aria-live="polite"></p>
        </div>

        <div class="home-action-grid">
          <button id="locateBtn" class="action-btn primary-action">
            <span class="action-icon">➤</span>
            <span><strong>使用目前位置</strong><small id="locationStatus">取得現在天氣</small></span>
          </button>
          <button id="nearbyBtn" class="action-btn" disabled>
            <span class="action-icon">☀</span>
            <span><strong>看現在怎麼穿</strong><small>依目前體感</small></span>
          </button>
        </div>

        <div class="tip-card">
          <span>💡</span>
          <div><strong>穿搭小提醒</strong><p id="homeTip">先定位，我會依體感溫度與降雨給你建議。</p></div>
        </div>
      </div>
    </section>

    <section id="screen-result-nearby" class="screen result-screen nearby-result">
      <header class="result-nav">
        <button class="round-btn" data-back="screen-home" aria-label="返回">←</button>
        <button class="pill-btn restart-btn">↻ 重新選擇</button>
      </header>

      <div class="nearby-grid">
        <div class="nearby-visual">
          <div class="result-weather-line">
            <span id="nearbyWeatherIcon" class="weather-icon-large">☀️</span>
            <div><span class="result-kicker">現在</span><strong id="nearbyTemp" class="result-temp">--°</strong><small id="nearbyPlace">目前位置</small></div>
          </div>
          <div id="nearbyCharacter" class="single-character-stage"></div>
          <div class="scribble">今天照這樣穿</div>
        </div>

        <div class="nearby-info">
          <p class="eyebrow">TODAY'S LOOK</p>
          <h2 id="nearbyHeadline">輕鬆穿</h2>
          <p id="nearbySummary" class="summary-text">依現在的體感安排穿搭。</p>

          <div class="metric-grid">
            <div class="metric-card"><span>體感</span><strong id="nearbyFeels">--°</strong></div>
            <div class="metric-card"><span>降雨</span><strong id="nearbyRain">--</strong></div>
            <div class="metric-card"><span>風速</span><strong id="nearbyWind">--</strong></div>
          </div>

          <div class="outfit-card">
            <div class="section-title">建議穿搭</div>
            <div id="nearbyOutfitList" class="outfit-list"></div>
          </div>

          <div id="nearbyAccessories" class="accessory-row"></div>
        </div>
      </div>
    </section>

    <section id="screen-result-trip" class="screen result-screen trip-result">
      <header class="result-nav">
        <button class="round-btn" data-back="screen-home" aria-label="返回">←</button>
        <button class="pill-btn restart-btn">↻ 重新選擇</button>
      </header>

      <div class="trip-overview">
        <div class="trip-weather-card">
          <span class="result-kicker">現在</span>
          <div class="weather-number"><span id="tripCurrentIcon">☀️</span><strong id="tripCurrentTemp">--°</strong></div>
          <small id="tripCurrentPlace">目前位置</small>
        </div>
        <div class="trip-route">
          <span class="route-line"></span>
          <strong id="tripEta">-- 分</strong>
          <span class="route-arrow">→</span>
        </div>
        <div class="trip-weather-card align-right">
          <span class="result-kicker">抵達</span>
          <div class="weather-number"><span id="tripDestIcon">☀️</span><strong id="tripDestTemp">--°</strong></div>
          <small id="tripDestPlace">目的地</small>
        </div>
      </div>

      <div class="journey-stage">
        <div class="journey-zone current-zone">
          <div id="tripCurrentCharacter" class="journey-character"></div>
          <span class="journey-label">出發中</span>
        </div>
        <div class="journey-middle" aria-hidden="true">→</div>
        <div class="journey-zone destination-zone">
          <div id="tripDestCharacter" class="journey-character"></div>
          <span class="journey-label">抵達後</span>
        </div>
      </div>

      <div class="trip-bottom-grid">
        <div class="trip-advice-card">
          <p class="eyebrow">TRIP OUTFIT</p>
          <h2 id="tripHeadline">一路照這樣穿</h2>
          <p id="tripSummary" class="summary-text"></p>
          <div id="tripCarry" class="carry-row"></div>
        </div>
        <div class="trip-metrics-card">
          <div><span>出發體感</span><strong id="tripCurrentFeels">--°</strong></div>
          <div><span>抵達體感</span><strong id="tripDestFeels">--°</strong></div>
          <div><span>抵達降雨</span><strong id="tripDestRain">--</strong></div>
        </div>
      </div>
    </section>
  </main>

  <div id="personModal" class="person-modal" aria-hidden="true">
    <button class="modal-backdrop" data-close-person aria-label="關閉"></button>
    <div class="person-sheet" role="dialog" aria-modal="true" aria-labelledby="person-title">
      <div class="sheet-handle"></div>
      <p class="eyebrow">STYLE PROFILE</p>
      <h2 id="person-title">選擇人物</h2>
      <div class="person-picker" role="group" aria-label="選擇人物樣式">
        <button class="person-card" data-person="a" aria-label="選擇男生人物"><div class="person-preview" data-preview="a"></div><span>LOOK A</span></button>
        <button class="person-card" data-person="b" aria-label="選擇女生人物"><div class="person-preview" data-preview="b"></div><span>LOOK B</span></button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="outfit.js"></script>
  <script src="character-assets.js"></script>
  <script src="google-places.js"></script>
  <script src="script.js"></script>
</body>
</html>
